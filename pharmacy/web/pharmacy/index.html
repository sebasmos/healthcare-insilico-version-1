<!doctype html>
<html lang="en" data-app="pharmacy">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharmacy</title>
<link rel="stylesheet" href="/shared/ui.css">
<style>
  .metrics { display: flex; flex-wrap: wrap; gap: 0.5rem 1.375rem; padding: 0.5rem 0.75rem; margin-bottom: 0.875rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0.625rem; font-size: 1.0313rem; }
  .metrics b { font-variant-numeric: tabular-nums; font-size: 1.125rem; }
  .elapsed.late { color: var(--danger); font-weight: 600; }
  .review { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 1rem; align-items: start; }
  .issue-high { border-left: 0.25rem solid var(--danger); }
  .issue-moderate { border-left: 0.25rem solid var(--warn); }
  .issue-low { border-left: 0.25rem solid var(--line); }
  .issue { padding: 0.5rem 0.625rem; margin: 0.375rem 0; background: var(--surface-2); border-radius: 0.375rem; }
  .thread .msg { padding: 0.5rem 0.625rem; margin: 0.375rem 0; border-radius: 0.5rem; background: var(--surface-2); }
  .thread .msg.answer { background: var(--accent-soft); }
  .label-sheet { max-width: 30rem; border: 1px dashed var(--ink-3); padding: 1.125rem 1.25rem; background: var(--surface); font-family: var(--mono); font-size: 1.0625rem; }
  .label-sheet div { margin: 0.1875rem 0; }
  .label-sheet .big { font-size: 1.3125rem; font-weight: 700; font-family: inherit; }
  @media (max-width: 1100px) { .review { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/pharmacy/app.js"></script>
</body>
</html>
