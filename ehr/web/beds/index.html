<!doctype html>
<html lang="en" data-app="beds">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beds</title>
<link rel="stylesheet" href="/shared/ui.css">
<style>
  .bstrip { display: flex; flex-wrap: wrap; gap: 0.5rem 1.375rem; align-items: baseline; padding: 0.5rem 1rem; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 1.0313rem; }
  .bstrip b { font-variant-numeric: tabular-nums; font-size: 1.125rem; }
  .bstrip .timetravel { margin-left: auto; display: flex; align-items: center; gap: 0.375rem; font-weight: 600; }
  .board { display: grid; grid-template-columns: minmax(0, 1fr) 22.5rem; gap: 1rem; align-items: start; }
  .units { display: grid; grid-template-columns: repeat(auto-fit, minmax(18.75rem, 1fr)); gap: 1rem; align-items: start; }
  .unit h3 { display: flex; align-items: center; gap: 0.5rem; text-transform: none; letter-spacing: 0; font-size: 1.1875rem; color: var(--ink); }
  .unit h3 .occ { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-2); font-size: 1.0625rem; }
  .unit .constraints { display: flex; gap: 0.25rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .unit .room { font-size: 0.9688rem; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; margin: 0.5rem 0 0.25rem; }
  .unit .beds { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.25rem, 1fr)); gap: 0.375rem; }
  .bed { display: block; text-align: left; height: auto; padding: 0.375rem 0.5rem; border-left: 0.25rem solid var(--line-s); border-radius: 0.375rem; white-space: normal; line-height: 1.3; }
  .bed b { display: block; font-size: 1.0625rem; }
  .bed .state { display: inline-block; font-size: 0.9063rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 0.375rem; border-radius: 62.4375rem; margin: 0.125rem 0; }
  .bed .who { font-size: 1rem; }
  .bed .iso { font-size: 0.9375rem; font-weight: 700; color: var(--danger); }
  .bed .time { font-size: 0.9375rem; color: var(--ink-3); }
  .bed.state-available { border-left-color: var(--ok); } .bed.state-available .state { background: var(--ok-soft); color: var(--ok); }
  .bed.state-occupied { border-left-color: var(--accent); } .bed.state-occupied .state { background: var(--accent-soft); color: var(--accent); }
  .bed.state-cleaning { border-left-color: var(--warn); } .bed.state-cleaning .state { background: var(--warn-soft); color: var(--warn); }
  .bed.state-blocked { border-left-color: var(--danger); } .bed.state-blocked .state { background: var(--danger-soft); color: var(--danger); }
  .bed.state-reserved { border-left-color: var(--ink-3); } .bed.state-reserved .state { background: var(--surface-2); color: var(--ink-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 0.625rem; font-size: 1rem; color: var(--ink-2); margin-bottom: 0.75rem; }
  .legend span::before { content: ''; display: inline-block; width: 0.625rem; height: 0.625rem; border-radius: 0.125rem; margin-right: 0.3125rem; vertical-align: middle; background: var(--line-s); }
  .legend .available::before { background: var(--ok); } .legend .occupied::before { background: var(--accent); } .legend .cleaning::before { background: var(--warn); } .legend .blocked::before { background: var(--danger); } .legend .reserved::before { background: var(--ink-3); }
  @media (max-width: 1100px) { .board { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/beds/app.js"></script>
</body>
</html>
