<!doctype html>
<html lang="en" data-app="monitoring">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring</title>
<link rel="stylesheet" href="/shared/ui.css">
<style>
  .metrics { display: flex; flex-wrap: wrap; gap: 0.5rem 1.375rem; padding: 0.5rem 0.75rem; margin-bottom: 0.875rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0.625rem; font-size: 1.0313rem; }
  .metrics b { font-variant-numeric: tabular-nums; font-size: 1.125rem; }
  .spark { width: 6rem; height: 1.75rem; vertical-align: middle; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .spark .flag { fill: var(--warn); }
  .chart { width: 100%; max-width: 45rem; height: 11.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0.625rem; }
  .chart text { font-size: 0.9375rem; fill: var(--ink-3); font-family: var(--mono); }
  .chart polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .chart .limit { stroke: var(--danger); stroke-dasharray: 4 3; }
  .chart .pt { fill: var(--accent); }
  .chart .pt.out { fill: var(--danger); }
  .patient { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 1rem; align-items: start; }
  @media (max-width: 1100px) { .patient { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/monitoring/app.js"></script>
</body>
</html>
